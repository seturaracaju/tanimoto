
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alfredo Tanimoto | Experiência Exclusiva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@300;400;500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
      :root {
        --gold: #F5C518;
        --deep-blue: #0B1F3A;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #050505;
        color: #F8FAFC;
        scroll-behavior: smooth;
      }
      h1, h2, h3, .font-title {
        font-family: 'Montserrat', sans-serif;
        letter-spacing: -0.02em;
      }
      .font-signature {
        font-family: 'Dancing Script', cursive;
      }
      
      /* Cinematic Hero Overlay - Radial to protect face */
      .hero-overlay {
        background: radial-gradient(circle at 75% 40%, transparent 0%, rgba(5,5,5,0.4) 30%, rgba(5,5,5,0.95) 70%);
      }
      @media (max-width: 768px) {
        .hero-overlay {
          background: linear-gradient(to top, rgba(5,5,5,1) 40%, rgba(5,5,5,0.2) 100%);
        }
      }

      .glass {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .gold-glow {
        box-shadow: 0 0 20px rgba(245, 197, 24, 0.15);
      }

      .gold-glow-hover:hover {
        box-shadow: 0 0 35px rgba(245, 197, 24, 0.3);
        border-color: var(--gold);
      }

      @keyframes slide-infinite {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }

      .logo-slide {
        display: flex;
        width: fit-content;
        animation: slide-infinite 30s linear infinite;
      }

      .section-transition {
        height: 150px;
        background: linear-gradient(to bottom, #050505, #ffffff);
      }

      .animate-reveal {
        animation: fade-up 1.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      @keyframes fade-up {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .seigaiha-pattern {
        background-image: radial-gradient(circle at 100% 150%, transparent 24%, rgba(245, 197, 24, 0.03) 25%, rgba(245, 197, 24, 0.03) 28%, transparent 29%);
        background-size: 60px 30px;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "lucide-react": "https://esm.sh/lucide-react@^0.564.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
      }
    }
    </script>
  </head>
  <body class="overflow-x-hidden">
    <div id="root"></div>
  </body>
</html>
